<h1>ClipBot</h1>
<p>ClipBot is a personal, single-user tool. It turns highlights from Kick live streams into short vertical videos and uploads them to its owner's own YouTube channel.</p>
<p>It is not offered to the public and does not access anyone else's account.</p>
